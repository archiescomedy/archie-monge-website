# Netlify settings. No build step: the folder is published as-is.
[build]
  publish = "."

# Always fetch the latest content.yaml so edits show up immediately.
[[headers]]
  for = "/content.yaml"
  [headers.values]
    Content-Type = "text/yaml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pretty URLs: /about, /clips, /gigs, /book
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/clips"
  to = "/clips.html"
  status = 200
[[redirects]]
  from = "/gigs"
  to = "/gigs.html"
  status = 200
[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200
